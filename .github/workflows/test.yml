name: Test and Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Assets
        run: |
          cd web
          npm ci
          npm run build

      - name: Run Go Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Compile Binary
        run: go build -ldflags="-s -w" -o feedbackloom ./cmd/feedbackloom
